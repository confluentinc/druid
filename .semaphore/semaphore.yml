version: v1.0
name: Apache Druid
agent:
  machine:
    type: s1-prod-ubuntu24-04-amd64-3
execution_time_limit:
  hours: 3
blocks:
  - name: "Install"
    task:
      env_vars: &env_vars
        - name: MVN
          value: "mvn -B"
        - name: MAVEN_OPTS
          value: "-Dmaven.repo.local=.m2"
        - name: MAVEN_SKIP
          value: >
            -Danimal.sniffer.skip=true
            -Dcheckstyle.skip=true
            -Ddruid.console.skip=true
            -Denforcer.skip=true
            -Dforbiddenapis.skip=true
            -Dmaven.javadoc.skip=true
            -Dpmd.skip=true
            -Dspotbugs.skip=true

        - name: MAVEN_SKIP_TESTS
          value: "-DskipTests -Djacoco.skip=true"
      prologue:
        commands:
          - echo $SEMAPHORE_WORKFLOW_ID
          - sem-version java 17
          - checkout
      jobs:
        - name: "Install"
          commands:
            # This is a change meant to validate semaphore public builds
            # so thus removing configurations for Confluent's internal CodeArtifact
            - rm ~/.m2/settings.xml
            # No clean needed on a fresh checkout
            - >
              MAVEN_OPTS="${MAVEN_OPTS} -Xmx3000m" ${MVN} install
              -q -ff ${MAVEN_SKIP} ${MAVEN_SKIP_TESTS} -T1C
            # downstream tests depend on artifacts installed by mvn install into .m2
            # also cache target to avoid the cost of recompiling tests
            - tar zcf cache-post-install.tgz .m2 target
            - artifact push workflow cache-post-install.tgz

  - name: "Tests"
    task:
      env_vars: *env_vars
      prologue:
        commands:
          - echo $SEMAPHORE_WORKFLOW_ID
          - sem-version java 17
          - checkout
          - artifact pull workflow cache-post-install.tgz
          - tar zxf cache-post-install.tgz
          # This is a change meant to validate semaphore public builds
          # so thus removing configurations for Confluent's internal CodeArtifact
          - rm ~/.m2/settings.xml
      jobs:
        - name: "animal sniffer checks"
          commands:
            - ${MVN} test-compile ${MAVEN_SKIP} ${MAVEN_SKIP_TESTS}
            - ${MVN} animal-sniffer:check --fail-at-end

        - name: "checkstyle"
          commands:
            - ${MVN} checkstyle:checkstyle --fail-at-end

        - name: "enforcer checks"
          commands:
            - ${MVN} enforcer:enforce --fail-at-end

        - name: "forbidden api checks"
          commands:
            - ${MVN} test-compile ${MAVEN_SKIP} ${MAVEN_SKIP_TESTS}
            - ${MVN} forbiddenapis:check forbiddenapis:testCheck --fail-at-end

        - name: "pmd checks"
          commands:
            - ${MVN} pmd:check --fail-at-end  # TODO: consider adding pmd:cpd-check

        - name: "spotbugs checks"
          commands:
            - ${MVN} spotbugs:check --fail-at-end -pl '!benchmarks'

        - name: "analyze dependencies"
          commands:
            - >
              ${MVN} ${MAVEN_SKIP} dependency:analyze -DoutputXML=true -DignoreNonCompile=true -DfailOnWarning=true --fail-at-end || { echo "

              The dependency analysis has found a dependency that is either:
              1) Used and undeclared: These are available as a transitive dependency but should be explicitly
              added to the POM to ensure the dependency version. The XML to add the dependencies to the POM is
              shown above.
              2) Unused and declared: These are not needed and removing them from the POM will speed up the build
              and reduce the artifact size. The dependencies to remove are shown above.
              If there are false positive dependency analysis warnings, they can be suppressed:
              https://maven.apache.org/plugins/maven-dependency-plugin/analyze-mojo.html#usedDependencies
              https://maven.apache.org/plugins/maven-dependency-plugin/examples/exclude-dependencies-from-dependency-analysis.html
              For more information, refer to:
              https://maven.apache.org/plugins/maven-dependency-plugin/analyze-mojo.html
              " && false; }

        - name: "Confluent Extensions"
          env_vars:
            - name: MAVEN_PROJECTS
              value: extensions-contrib/confluent-extensions
          commands: &run_tests
            # -Djacoco.skip=true: no coverage is collected/uploaded in this pipeline, so the
            # jacoco agent's per-class instrumentation is pure overhead on every test job.
            - >
              MAVEN_OPTS="${MAVEN_OPTS} -Xmx1g" ${MVN} test -pl ${MAVEN_PROJECTS}
              ${MAVEN_SKIP} -Djacoco.skip=true -Dremoteresources.skip=true

        # sql rides along with server in the same reactor so that druid-server is built from
        # source (target/classes) rather than resolved from the installed JAR. SystemSchemaTest
        # reads the sys.servers druid_version/build_revision from the druid-server JAR manifest
        # (DruidNode / BuildInfo); under a per-module `-pl sql` run that manifest carries the real
        # version (e.g. 37.0.0), but the test expects the manifest-less value ("unknown"/"") that
        # upstream's full-reactor `mvn test` produces. Co-locating sql with server matches upstream.
        - name: "Server and SQL"
          env_vars:
            - name: MAVEN_PROJECTS
              value: server,sql
          commands: *run_tests

        # processing (~997 test classes) split by class-name prefix into 3 parallel jobs.
        # -Dsurefire.failIfNoSpecifiedTests=false so a prefix matching zero classes doesn't fail.
        - name: "Processing (C,S,A,K,Y)"
          env_vars:
            - name: MAVEN_PROJECTS
              value: processing
            - name: MAVEN_OPTS
              value: "-Dmaven.repo.local=.m2 -Dsurefire.failIfNoSpecifiedTests=false -Dtest=C*,S*,A*,K*,Y*"
          commands: *run_tests

        - name: "Processing (D,F,L,I,N,E)"
          env_vars:
            - name: MAVEN_PROJECTS
              value: processing
            - name: MAVEN_OPTS
              value: "-Dmaven.repo.local=.m2 -Dsurefire.failIfNoSpecifiedTests=false -Dtest=D*,F*,L*,I*,N*,E*"
          commands: *run_tests

        # "rest" = negation of the two legs above, so no class prefix is ever silently dropped.
        - name: "Processing (rest)"
          env_vars:
            - name: MAVEN_PROJECTS
              value: processing
            - name: MAVEN_OPTS
              value: "-Dmaven.repo.local=.m2 -Dsurefire.failIfNoSpecifiedTests=false -Dtest=!C*,!S*,!A*,!K*,!Y*,!D*,!F*,!L*,!I*,!N*,!E*"
          commands: *run_tests

        # indexing-service (~219 test classes) split by class-name prefix into 2 parallel jobs.
        - name: "Indexing Service (S,T,R,A,H,W)"
          env_vars:
            - name: MAVEN_PROJECTS
              value: indexing-service
            - name: MAVEN_OPTS
              value: "-Dmaven.repo.local=.m2 -Dsurefire.failIfNoSpecifiedTests=false -Dtest=S*,T*,R*,A*,H*,W*"
          commands: *run_tests

        - name: "Indexing Service (rest)"
          env_vars:
            - name: MAVEN_PROJECTS
              value: indexing-service
            - name: MAVEN_OPTS
              value: "-Dmaven.repo.local=.m2 -Dsurefire.failIfNoSpecifiedTests=false -Dtest=!S*,!T*,!R*,!A*,!H*,!W*"
          commands: *run_tests

        - name: "Kafka Indexing Service"
          env_vars:
            - name: MAVEN_PROJECTS
              value: extensions-core/kafka-indexing-service
          commands: *run_tests

        - name: "Web Console"
          env_vars:
            - name: MAVEN_PROJECTS
              value: web-console
          commands: *run_tests

        - name: "Services"
          env_vars:
            - name: MAVEN_PROJECTS
              value: services
            - name: MAVEN_OPTS
              value: "-DforkCount=1 -DreuseForks=false"
          commands: *run_tests

        # quidem-ut and embedded-tests were one serial reactor (~48m + ~56m); split into
        # independent jobs on separate agents. Both keep:
        #   -Dmaven.repo.local=.m2 (else deps resolve to upstream 37.0.0 from Central, not our build)
        #   -DforkCount=1 -DreuseForks=false (fresh JVM per class; embedded clusters bind fixed ports
        #     7090/8889-8891 so forkCount>1 on one agent collides — parallelism comes from split jobs)
        # -Dtest=!KafkaIndexFaultToleranceTest: upstream supervisor-recovery test stalls only on the CI
        #   agent; it's covered by apache's own docker-tests CI, so excluded here.
        # -Dtest=!Kinesis*: Confluent does not use Kinesis; its embedded tests (~7m) are dropped.
        # quidem-ut (~48m as one job) split via QTest's -Dquidem.split=index/count (hash-bucketed
        # .iq files). Job 1 also runs LauncherSmokeTest; job 2 is QTest-only so nothing runs twice.
        - name: "Quidem UT (0/2)"
          env_vars:
            - name: MAVEN_PROJECTS
              value: quidem-ut
            - name: MAVEN_OPTS
              value: "-Dmaven.repo.local=.m2 -DforkCount=1 -DreuseForks=false -Dquidem.split=0/2"
          commands: *run_tests

        - name: "Quidem UT (1/2)"
          env_vars:
            - name: MAVEN_PROJECTS
              value: quidem-ut
            - name: MAVEN_OPTS
              value: "-Dmaven.repo.local=.m2 -DforkCount=1 -DreuseForks=false -Dtest=QTest -Dquidem.split=1/2"
          commands: *run_tests

        # embedded-tests (~123 classes) split by class-name prefix into 3 parallel jobs.
        - name: "Embedded Tests (I,C)"
          env_vars:
            - name: MAVEN_PROJECTS
              value: embedded-tests
            - name: MAVEN_OPTS
              value: "-Dmaven.repo.local=.m2 -DforkCount=1 -DreuseForks=false -Dsurefire.failIfNoSpecifiedTests=false -Dtest=!KafkaIndexFaultToleranceTest,!Kinesis*,I*,C*"
          commands: *run_tests

        - name: "Embedded Tests (A,K,H,B,E)"
          env_vars:
            - name: MAVEN_PROJECTS
              value: embedded-tests
            - name: MAVEN_OPTS
              value: "-Dmaven.repo.local=.m2 -DforkCount=1 -DreuseForks=false -Dsurefire.failIfNoSpecifiedTests=false -Dtest=!KafkaIndexFaultToleranceTest,!Kinesis*,A*,K*,H*,B*,E*"
          commands: *run_tests

        - name: "Embedded Tests (rest)"
          env_vars:
            - name: MAVEN_PROJECTS
              value: embedded-tests
            - name: MAVEN_OPTS
              value: "-Dmaven.repo.local=.m2 -DforkCount=1 -DreuseForks=false -Dsurefire.failIfNoSpecifiedTests=false -Dtest=!KafkaIndexFaultToleranceTest,!Kinesis*,!I*,!C*,!A*,!K*,!H*,!B*,!E*"
          commands: *run_tests

        # Everything not tested by a dedicated job above. The trailing block of exclusions are
        # modules Confluent does not ship (absent from distribution/pom.xml dist-used /
        # bundle-contrib-exts-used): cloud/vendor storage & compute, alternative metadata stores,
        # unused emitters, unused ingest/format/query/sketch extensions. Their tests are skipped.
        - name: "Other Tests"
          env_vars:
            - name: MAVEN_PROJECTS
              value: >-
                !server,!sql,!processing,!indexing-service,!extensions-core/kafka-indexing-service,!extensions-contrib/confluent-extensions,!web-console,!services,!embedded-tests,!quidem-ut,!extensions-core/kinesis-indexing-service,!extensions-core/azure-extensions,!extensions-core/google-extensions,!extensions-core/ec2-extensions,!extensions-core/hdfs-storage,!extensions-contrib/gce-extensions,!extensions-contrib/aliyun-oss-extensions,!extensions-contrib/cloudfiles-extensions,!extensions-core/mysql-metadata-storage,!extensions-contrib/sqlserver-metadata-storage,!extensions-contrib/cassandra-storage,!extensions-core/druid-kerberos,!extensions-contrib/druid-ranger-security,!extensions-contrib/consul-extensions,!extensions-core/lookups-cached-single,!extensions-contrib/graphite-emitter,!extensions-contrib/opentsdb-emitter,!extensions-contrib/influxdb-emitter,!extensions-contrib/ambari-metrics-emitter,!extensions-contrib/dropwizard-emitter,!extensions-core/orc-extensions,!extensions-core/parquet-extensions,!extensions-core/avro-extensions,!extensions-contrib/thrift-extensions,!extensions-contrib/druid-iceberg-extensions,!extensions-contrib/druid-deltalake-extensions,!extensions-contrib/grpc-query,!extensions-contrib/rabbit-stream-indexing-service,!extensions-contrib/redis-cache,!extensions-contrib/influx-extensions,!extensions-core/druid-bloom-filter,!extensions-core/histogram,!extensions-core/stats,!extensions-contrib/momentsketch,!extensions-contrib/tdigestsketch,!extensions-contrib/ddsketch,!extensions-contrib/moving-average-query,!extensions-contrib/distinctcount,!extensions-contrib/druid-exact-count-bitmap,!extensions-contrib/time-min-max,!extensions-contrib/virtual-columns,!extensions-contrib/compressed-bigdecimal,!extensions-contrib/spectator-histogram,!extensions-contrib/opentelemetry-extensions
          commands: *run_tests